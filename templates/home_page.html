<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>College Scoops | Find Your Fit</title>
    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f1f3f5;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .container {
        background-color: #ffffff;
        border-radius: 15px;
        box-shadow: 0 6px 25px rgba(0, 0, 0, 0.15);
        padding: 40px 50px;
        max-width: 500px;
        width: 90%;
        text-align: center;
      }

      h1 {
        color: #2b2d42;
        font-size: 2.2rem;
        margin-bottom: 0.3rem;
      }

      h2 {
        color: #6c757d;
        font-weight: 500;
        margin-top: 0;
      }

      h3 {
        color: #495057;
        font-weight: 400;
        margin-bottom: 30px;
        font-size: 1rem;
      }

      form {
        text-align: left;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #343a40;
      }

      input[type="text"] {
        width: 100%;
        padding: 10px 12px;
        margin-bottom: 18px;
        border: 1px solid #ced4da;
        border-radius: 6px;
        font-size: 1rem;
        transition: border-color 0.3s ease;
      }

      input[type="text"]:focus {
        border-color: #007bff;
        outline: none;
      }

      input[type="submit"] {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 12px 18px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 1rem;
        width: 100%;
        transition: background-color 0.3s ease;
      }

      input[type="submit"]:hover {
        background-color: #0056b3;
      }

      footer {
        margin-top: 20px;
        color: #6c757d;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>College Scoops</h1>
      <h2>Find Your Fit College</h2>
      <h3>
        Enter your academic information and interests to discover your best-fit
        colleges
      </h3>

      <form>
        <label for="major">Intended Major</label>
        <input
          type="text"
          id="major"
          name="major"
          placeholder="e.g., Computer Science"
        />

        <label for="scores">Test Scores (SAT or ACT)</label>
        <input
          type="text"
          id="scores"
          name="scores"
          placeholder="e.g., 1450 SAT or 32 ACT"
        />

        <label for="gpa">GPA</label>
        <input type="text" id="gpa" name="gpa" placeholder="e.g., 3.9" />

        <label for="awards">Achievements or Awards</label>
        <input
          type="text"
          id="awards"
          name="awards"
          placeholder="e.g., National Merit, DECA Finalist"
        />

        <input type="submit" value="Find Your Colleges" />
      </form>

      <footer>
        © 2025 College Scoops | Designed to help you find your perfect match
      </footer>
    </div>
  </body>
</html>
